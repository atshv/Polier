name: release

# Publishes a release from Conventional Commits on every push to main.
# scripts/release.py reads the commits since the last vX.Y.Z tag: feat → minor,
# fix/perf → patch, `!` or a BREAKING CHANGE footer → major. A hand-made bump of
# VERSION with its own CHANGELOG section is released as written. The workflow
# commits VERSION, package.json and CHANGELOG.md as "chore(release): vX.Y.Z",
# runs the tests, tags and creates the GitHub Release. Tags and releases are
# never moved or overwritten. "Run workflow" (manual) does the same on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan the release
        id: plan
        run: python3 scripts/release.py --write --notes release-notes.md --github-output "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.plan.outputs.release == 'true'
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pyflakes
          npm test
          npm run check

      - name: Commit the release files
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.plan.outputs.tag }}"
          git push origin HEAD:main

      - name: Tag and publish
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists; it is not moved."
          else
            git tag -a "$TAG" -m "Polier $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; nothing to do."
          else
            gh release create "$TAG" --title "Polier $TAG" --notes-file release-notes.md --verify-tag
          fi
