name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Plugin and tool tests
        run: npm test
      - name: Example project passes check.py
        run: python3 tools/check.py examples/minimal-cli
      - name: Reference L project passes check.py
        run: python3 tools/check.py examples/monorepo-mini
      - name: Reference L evidence chain passes audit.py
        run: python3 tools/audit.py --root examples/monorepo-mini
      - name: Shipped manifest is current
        # Strict for pull requests. On main the release workflow rewrites the
        # manifest when VERSION changes, so a stale one is only a warning there.
        run: |
          if ! python3 tools/manifest.py --check; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
            echo "::warning::tools/manifest.json is stale; the release workflow updates it with the next VERSION change."
          fi
