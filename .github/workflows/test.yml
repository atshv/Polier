name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Plugin and tool tests
        run: npm test
      - name: Reference S project passes check.py
        run: python3 tools/check.py tests/fixtures/minimal-cli
      - name: Reference L project passes check.py
        run: python3 tools/check.py tests/fixtures/monorepo-mini
      - name: Reference L evidence chain passes audit.py
        run: python3 tools/audit.py --root tests/fixtures/monorepo-mini
      - name: Generated pages, dead code, syntax
        run: |
          python3 -m pip install --quiet pyflakes
          npm run check
